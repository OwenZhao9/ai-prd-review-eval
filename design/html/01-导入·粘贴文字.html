# Vault SVN 版本管理插件 - 需求文档 (v1.1)
## 1. 背景与目标
- 在 Obsidian 内提供 SVN 版本管理能力，管理本地笔记库。
- 降低对命令行的依赖，同时保持标准 SVN 工作流。</textarea>
</div>

          填入示例 PRD
        </button>
<div class="flex items-center gap-space-sm">

<button class="h-9 px-space-md bg-primary-container hover:opacity-95 text-on-primary rounded-lg font-body-medium text-body-medium inline-flex items-center justify-center transition-opacity focus:outline-none" onclick="handleNextStep()" type="button">
            下一步：拆分预览
          </button>
</div>
</div>

<script>
  function switchTab(tab) {
    const tabs = ['paste', 'upload', 'link'];
    tabs.forEach(t => {
      const btn = document.getElementById('tab-' + t);
      const view = document.getElementById('view-' + t);
      if (t === tab) {
        btn.className = "pb-space-xs font-body-medium text-body-medium text-primary-container shadow-[0_2px_0_0_currentColor] transition-colors focus:outline-none";
        view.classList.remove('hidden');
        view.classList.add('flex');
      } else {
        btn.className = "pb-space-xs font-body-default text-body-default text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none";
        view.classList.add('hidden');
        view.classList.remove('flex');
      }
    });
  }

  function fillSamplePrd() {
    const textarea = document.getElementById('prd-input');
    textarea.value = `> 示例来自 GitHub 开源项目 caesarloo/obsidian-svn 的需求文档（MIT 许可）
# Vault SVN 版本管理插件 - 需求文档 (v1.1)
## 1. 背景与目标
- 在 Obsidian 内提供 SVN 版本管理能力，管理本地笔记库。
- 降低对命令行的依赖，同时保持标准 SVN 工作流。

## 2. 核心功能规范
- 状态栏实时显示当前笔记文件的 SVN 版本与同步状态（已修改、无变动、未纳管）。
- 提交弹窗需支持快捷填入 Commit Message，并提供差异列表（Diff）快速比对。
- 异常边界：当本地客户端未配置 svn 命令行环境时，弹出友好阻断指引，不引发运行时崩溃。`;
    updateCharCount();
  }

  function updateCharCount() {
    const textarea = document.getElementById('prd-input');
    const counter = document.getElementById('char-counter');
    if (textarea && counter) {
      counter.innerText = textarea.value.length + ' 字';
    }
  }

  const textareaEl = document.getElementById('prd-input');
  if (textareaEl) {
    textareaEl.addEventListener('input', updateCharCount);
    updateCharCount();
  }

  function handleNextStep() {
    const val = document.getElementById('prd-input').value.trim();
    if (!val) {
      alert('请先输入 PRD 文档内容');
      return;
    }
    // 模拟推进到拆分预览节点
    const nextBtn = event.currentTarget;
    nextBtn.innerText = '正在解析文档结构...';
    nextBtn.classList.add('opacity-70');
    setTimeout(() => {
      nextBtn.innerText = '下一步：拆分预览';
      nextBtn.classList.remove('opacity-70');
    }, 600);
  }
</script></div></main></body></html>
