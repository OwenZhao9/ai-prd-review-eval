<!DOCTYPE html>

<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_standard" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={theme:{extend:{"colors":{"primary-fixed":"#dde1ff","error":"#ba1a1a","primary-fixed-dim":"#b7c4ff","inverse-surface":"#303032","on-primary-container":"#e5e8ff","tertiary-fixed":"#a7f3c3","on-surface":"#1b1b1d","inverse-primary":"#b7c4ff","outline":"#747686","on-primary-fixed":"#001452","secondary-container":"#fe5c4c","tertiary-container":"#2c764f","on-background":"#1b1b1d","surface-tint":"#1f4fdf","on-surface-variant":"#434655","on-secondary":"#ffffff","error-container":"#ffdad6","background":"#fcf8fb","on-secondary-container":"#610002","on-error-container":"#93000a","surface-container-low":"#f6f3f5","secondary":"#b4271f","surface-container":"#f0edef","secondary-fixed":"#ffdad5","on-tertiary-container":"#aefac9","outline-variant":"#c4c5d8","tertiary":"#095d38","on-secondary-fixed":"#410001","on-primary-fixed-variant":"#0038b7","surface-container-highest":"#e4e2e4","on-tertiary-fixed":"#002110","inverse-on-surface":"#f3f0f2","primary-container":"#2f5bea","on-secondary-fixed-variant":"#910809","primary":"#0040cf","surface-dim":"#dcd9dc","on-tertiary":"#ffffff","surface-container-lowest":"#ffffff","on-error":"#ffffff","surface-container-high":"#eae7ea","surface-variant":"#e4e2e4","on-tertiary-fixed-variant":"#005230","tertiary-fixed-dim":"#8cd6a8","on-primary":"#ffffff","surface":"#fcf8fb","secondary-fixed-dim":"#ffb4aa","surface-bright":"#fcf8fb"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"space-md":"16px","space-xl":"32px","space-sm":"8px","margin":"80px","space-xs":"4px","space-lg":"24px","gutter":"16px"},"fontFamily":{"headline-section":["Noto Sans"],"code-inline":["JetBrains Mono"],"caption":["Noto Sans"],"headline-page":["Noto Sans"],"body-default":["Noto Sans"],"caption-medium":["Noto Sans"],"body-medium":["Noto Sans"]},"fontSize":{"headline-section":["16px",{"lineHeight":"24px","letterSpacing":"0","fontWeight":"600"}],"code-inline":["13px",{"lineHeight":"20px","letterSpacing":"0","fontWeight":"400"}],"caption":["12px",{"lineHeight":"18px","letterSpacing":"0","fontWeight":"400"}],"headline-page":["24px",{"lineHeight":"32px","letterSpacing":"-0.01em","fontWeight":"600"}],"body-default":["14px",{"lineHeight":"22px","letterSpacing":"0","fontWeight":"400"}],"caption-medium":["12px",{"lineHeight":"18px","letterSpacing":"0","fontWeight":"500"}],"body-medium":["14px",{"lineHeight":"22px","letterSpacing":"0","fontWeight":"500"}]}}}}</script></head><body class="bg-surface-container-low font-body-default text-on-surface antialiased"><header class="fixed top-0 left-0 right-0 z-50 bg-white border-b border-[#ebe9e4]"><div class="h-14 max-w-[1120px] mx-auto px-4 flex items-center justify-between gap-4"><div class="flex items-center gap-3 min-w-0"><span class="text-[16px] font-semibold text-[#1d1d1f] whitespace-nowrap">AI 审 PRD</span><span class="hdr-sub text-[12px] text-[#6b6b70] truncate">单句规则 v4 · 文档级规则 doc_v1 · 账号与权限 module_account_v3 · 模型 deepseek-chat</span></div><nav class="flex items-center gap-1 flex-shrink-0"><a class="px-3 py-1 rounded text-[14px] whitespace-nowrap bg-[#eef0f4] text-[#1d1d1f] font-medium" href="#">审查</a><a class="px-3 py-1 rounded text-[14px] whitespace-nowrap text-[#6b6b70]" href="#">反馈复核</a><a class="px-3 py-1 rounded text-[14px] whitespace-nowrap text-[#6b6b70]" href="#">健康看板</a></nav></div></header><main class="w-full pt-14 bg-surface-container-low"><div class="max-w-[1120px] mx-auto py-space-lg"><div class="flex flex-col w-full">
<div class="mb-space-xl">
<div class="flex items-center justify-between mb-space-xs">
<h1 class="font-headline-page text-headline-page text-on-surface">导入 PRD</h1>
</div>
<p class="font-body-default text-body-default text-on-surface-variant">
      粘贴文字、上传文件或导入链接；导入后先看拆分结果，再开始审查
    </p>
</div>
<div class="w-full bg-surface-container-lowest rounded-xl shadow-sm p-space-lg">
<div class="flex items-center gap-space-lg mb-space-lg">
<button class="pb-space-xs font-body-default text-body-default text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none" id="tab-paste" onclick="switchTab('paste')" type="button">
        粘贴文字
      </button>
<button class="pb-space-xs font-body-medium text-body-medium text-primary-container shadow-[0_2px_0_0_currentColor] transition-colors focus:outline-none" id="tab-upload" onclick="switchTab('upload')" type="button">
        上传文件
      </button>
<button class="pb-space-xs font-body-default text-body-default text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none" id="tab-link" onclick="switchTab('link')" type="button">
        导入链接
      </button>
</div>
<div class="flex flex-col gap-space-md">
<div class="flex items-start gap-space-sm bg-error-container text-on-error-container rounded-lg p-space-md">
<svg aria-hidden="true" class="w-5 h-5 shrink-0 mt-0.5 text-error" fill="currentColor" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-5a.75.75 0 01.75.75v4.5a.75.75 0 01-1.5 0v-4.5A.75.75 0 0110 5zm0 10a1 1 0 100-2 1 1 0 000 2z" fill-rule="evenodd"></path>
</svg>
<div class="flex-1 font-body-default text-body-default leading-tight">
<span class="font-body-medium text-on-error-container">需求文档扫描件.pdf：</span>这份 PDF 里没有可提取的文字，请上传原始的 Word 文件
        </div>
</div>
<div class="group relative h-[180px] w-full rounded-lg bg-surface-container-low hover:bg-surface-container transition-all flex flex-col items-center justify-center cursor-pointer px-space-lg text-center" id="dropzone">
<input accept=".docx,.pptx,.pdf,.md,.txt" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" id="file-input" type="file"/>
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-surface-container-high text-on-surface-variant group-hover:text-primary-container mb-space-sm transition-colors">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"></path>
</svg>
</div>
<p class="font-body-default text-body-default text-on-surface">
          把文件拖到这里，或<span class="text-primary-container font-body-medium underline underline-offset-2 ml-1">点击选择文件</span>
</p>
<p class="font-caption text-caption text-on-surface-variant mt-space-xs font-code-inline">
          支持 .docx .pptx .pdf .md .txt，单个文件不超过 20 MB
        </p>
</div>
</div>
</div>
<script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');

    if (dropzone && fileInput) {
      ['dragenter', 'dragover'].forEach(name => {
        dropzone.addEventListener(name, (e) => {
          e.preventDefault();
          dropzone.classList.add('bg-surface-container-high');
        });
      });

      ['dragleave', 'drop'].forEach(name => {
        dropzone.addEventListener(name, (e) => {
          e.preventDefault();
          dropzone.classList.remove('bg-surface-container-high');
        });
      });

      fileInput.addEventListener('change', () => {
        if (fileInput.files.length > 0) {
          const fileName = fileInput.files[0].name;
          const label = dropzone.querySelector('p.text-on-surface');
          if (label) {
            label.textContent = '已选择: ' + fileName;
          }
        }
      });
    }
  </script>
</div></div></main></body></html>
