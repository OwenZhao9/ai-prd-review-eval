<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 审 PRD</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="split.js"></script>
<script src="convert.js"></script>
<!-- 布局沿用 Stitch 设计稿（design/stitch/all.html）；配色和字体参考 Dribbble「Tetra — Bold Minimalist」：黑白灰、黑色选中态、大号数字 -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>
// Tailwind 的 slate 换成不带蓝调的中性灰
tailwind.config={theme:{extend:{colors:{slate:{50:'#fafaf9',100:'#f4f4f3',200:'#e7e7e5',300:'#d6d6d3',400:'#a3a3a0',500:'#737371',600:'#525250',700:'#3a3a38',800:'#232322',900:'#111111'}}}}};
</script>
<style>
*{box-sizing:border-box;font-family:'Inter','Noto Sans SC',sans-serif}
body{background:#f3f3f2;color:#111;margin:0;-webkit-font-smoothing:antialiased}
.num{font-family:'Inter',sans-serif;font-weight:500;letter-spacing:-.04em;line-height:1;font-feature-settings:'tnum'}
.num .dim{color:#b5b5b2}
.label{font-size:11px;letter-spacing:.12em;color:#8f8f8c;font-weight:500}
.tag-danger,.tag-success,.tag-warning,.tag-gray,.tag-blue{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid #e7e7e5;background:#fff;color:#111}
.tag-danger::before,.tag-success::before,.tag-warning::before{content:'';width:6px;height:6px;border-radius:50%}
.tag-danger::before{background:#e5484d}.tag-success::before{background:#30a46c}.tag-warning::before{background:#f5a524}
.tag-gray{background:#f4f4f3;color:#737371;border-color:transparent}
.tag-blue{background:#111;color:#fff;border-color:#111}
.btn-primary{background:#111;color:#fff;border-radius:8px;padding:8px 16px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;border:1px solid #111}
.btn-primary:hover{background:#2b2b2a}
.btn-primary:disabled{background:#e7e7e5;border-color:#e7e7e5;color:#a3a3a0;cursor:not-allowed}
.btn-outline{border:1px solid #e1e1de;background:#fff;color:#111;border-radius:8px;padding:6px 14px;font-weight:500;font-size:13px;cursor:pointer;display:inline-flex;align-items:center}
.btn-outline:hover{background:#f7f7f6}.btn-outline:disabled{color:#b5b5b2;cursor:not-allowed;background:#fff}
.chip{border:1px solid #e1e1de;background:#fff;color:#3a3a38;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip.on{background:#111;border-color:#111;color:#fff}
.link{color:#111;font-size:13px;cursor:pointer;background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:#c9c9c6}
.card{background:#fff;border:1px solid #e7e7e5;border-radius:14px}
.subtab{padding:6px 14px;margin-right:4px;font-size:13px;color:#525250;border-radius:8px;cursor:pointer;background:none;font-weight:500}
.subtab.on{color:#fff;background:#111}
.drop{border:1.5px dashed #d6d6d3;border-radius:12px;background:#fafaf9}
.drop.over{border-color:#111;background:#f4f4f3}
mark{background:#111;color:#fff;border-radius:4px;padding:0 3px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #e7e7e5;border-top-color:#111;border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
.ins{background:#e6f4ec;color:#1a7f4b;border-radius:3px}.del{background:#fdecec;color:#b42318;text-decoration:line-through;border-radius:3px}
.gone{color:#a3a3a0;text-decoration:line-through}
[hidden]{display:none!important}
.sev{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;border-radius:5px;font-size:11px;font-weight:600;padding:0 5px}
.sev-3{background:#111;color:#fff}.sev-2{background:#e7e7e5;color:#111}.sev-1{background:#fff;color:#737371;border:1px solid #e1e1de}
.src{font-size:13px;line-height:1.75}
.src-line{display:flex;gap:12px;padding:1px 10px 1px 0;border-radius:6px;cursor:default}
.src-line .ln{width:34px;flex:none;text-align:right;color:#b5b5b2;font-variant-numeric:tabular-nums;user-select:none}
.src-line .tx{white-space:pre-wrap;word-break:break-word;flex:1;min-width:0}
.src-line.h .tx{font-weight:600}
.src-line.hit{background:#fafaf9;cursor:pointer}.src-line.hit .tx{text-decoration:underline;text-decoration-color:#e5484d;text-underline-offset:4px;text-decoration-thickness:1.5px}
.src-line.hit:hover{background:#f4f4f3}
.src-badge{flex:none;align-self:flex-start;margin-top:3px;font-size:11px;line-height:16px;min-width:18px;text-align:center;border-radius:9px;background:#111;color:#fff;padding:0 5px}
.flash{animation:fl 1.2s ease}@keyframes fl{0%{background:#fff3c4}100%{background:transparent}}
textarea,input,select{outline:none}
textarea:focus,input[type=text]:focus,input[type=password]:focus,select:focus{border-color:#111!important}
.modal-bg{position:fixed;inset:0;background:rgba(17,17,17,.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.toast{position:fixed;right:24px;bottom:24px;background:#111;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:60}
.toc-item{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;font-size:13px;cursor:pointer;color:#525250}
.toc-item:hover{background:#f4f4f3}.toc-item.on{background:#111;color:#fff}.toc-item.on .tag-blue{background:#fff;color:#111}
/* 侧边栏导航 */
aside{position:fixed;left:0;top:0;bottom:0;width:240px;background:#fff;border-right:1px solid #e7e7e5;padding:22px 16px;display:flex;flex-direction:column;z-index:20}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:8px;font-size:14px;color:#3a3a38;text-align:left}
.nav-btn:hover{background:#f4f4f3}
.nav-btn.tab-on{background:#111;color:#fff}
.nav-btn svg{width:16px;height:16px;flex:none}
.shell{margin-left:240px}
.narrow-only{display:none}
@media (max-width:1279px){.wide-only{display:none!important}.narrow-only{display:block}.split{grid-template-columns:1fr!important}}
@media (max-width:1023px){aside{position:static;width:auto;flex-direction:row;align-items:center;gap:12px;padding:10px 16px;border-right:0;border-bottom:1px solid #e7e7e5;overflow-x:auto}
  aside .side-extra{display:none}aside nav{display:flex;gap:4px}aside .nav-group{display:flex;gap:4px}.nav-btn{width:auto;white-space:nowrap;padding:7px 12px}.shell{margin-left:0}}
</style>
</head>
<body>
<aside>
  <div class="flex items-center gap-2.5 px-2">
    <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><rect x="2" y="3" width="3.5" height="14" rx="1" fill="#111"/><rect x="8.25" y="3" width="3.5" height="9" rx="1" fill="#111"/><rect x="14.5" y="3" width="3.5" height="14" rx="1" fill="#111"/></svg>
    <span class="text-[17px] font-semibold tracking-tight">AI 审 PRD</span>
  </div>
  <div class="side-extra px-2 mt-6 mb-5"><div class="text-[15px] font-medium">审查 PRD</div><div class="text-[15px] text-slate-400">逐条找出写得不清楚的需求</div></div>
  <nav id="nav" class="flex-1">
    <div class="nav-group"><div class="label side-extra px-3 mb-2 mt-2">工作台</div>
      <button data-tab="review" class="nav-btn tab-on"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="2" width="10" height="12" rx="1.5"/><path d="M5.5 5.5h5M5.5 8h5M5.5 10.5h3"/></svg>审查</button></div>
    <div class="nav-group"><div class="label side-extra px-3 mb-2 mt-6">维护</div>
      <button data-tab="fb" class="nav-btn"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/></svg>反馈复核 <span id="pend" class="ml-auto text-xs"></span></button>
      <button data-tab="dash" class="nav-btn"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 13.5h11M4.5 11V7M8 11V4M11.5 11V8.5"/></svg>健康看板</button>
      <button data-tab="github" class="nav-btn"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="4.5" cy="4" r="1.5"/><circle cx="4.5" cy="12" r="1.5"/><circle cx="11.5" cy="8" r="1.5"/><path d="M4.5 5.5v5M6 4h2.5a3 3 0 0 1 3 3v-.5"/></svg>接入 GitHub</button></div>
  </nav>
  <div class="side-extra px-2 text-[11px] leading-5 text-slate-400" id="ver">单句规则 v4 · 文档级规则 doc_v1 · 账号与权限 module_account_v3 · 模型 deepseek-chat</div>
</aside>
<div class="shell">
<div class="px-5 md:px-8 pt-7 pb-2 flex items-end justify-between gap-4 flex-wrap">
  <div><div class="label mb-1.5" id="page-label">工作台</div><h1 class="text-[28px] font-medium tracking-tight leading-none" id="page-title">审查</h1></div>
  <div class="flex gap-1" id="steps"></div>
</div>
<main class="max-w-[1440px] px-5 md:px-8 py-5">
<!-- 审查 -->
<section id="tab-review">
  <!-- 第一步：导入 -->
  <div id="step-import" class="grid gap-5 split" style="grid-template-columns:minmax(0,1fr) 340px">
    <div><div class="card p-6">
      <div class="mb-5 flex" id="import-tabs">
        <button class="subtab on" data-src="paste">粘贴文字</button>
        <button class="subtab" data-src="upload">上传文件</button>
        <button class="subtab" data-src="link">导入链接</button>
      </div>
      <div id="src-paste">
        <textarea id="prd" class="w-full h-72 border border-slate-200 rounded-lg p-3 text-sm leading-relaxed bg-slate-50 font-mono" placeholder="把 PRD 粘贴到这里，支持 Markdown 和纯文本，按 # 标题拆成段落"></textarea>
      </div>
      <div id="src-upload" hidden>
        <label id="drop" class="drop flex flex-col items-center justify-center text-center p-10 cursor-pointer">
          <input type="file" id="file" class="hidden" accept=".md,.txt,.docx,.pptx,.pdf">
          <div class="text-sm text-slate-700 font-medium" id="drop-title">点击选择文件，或把文件拖到这里</div>
          <div class="text-xs text-slate-400 mt-2">支持 .md .docx .pdf .pptx .txt，单个文件不超过 20 MB，一次一个文件。文件在浏览器里转成文字，原文件不上传。</div>
        </label>
        <div id="upload-state" class="mt-4"></div>
      </div>
      <div id="src-link" hidden>
        <div class="flex gap-2">
          <input id="url" type="text" class="flex-1 border border-slate-200 rounded-lg px-3 py-2 text-sm" placeholder="粘贴文档链接，例如 https://github.com/用户/仓库/blob/main/docs/PRD.md">
          <button class="btn-outline" id="fetch">获取</button>
        </div>
        <div class="text-xs text-slate-400 mt-2">支持 GitHub、GitLab、公开网页和文件直链。需要登录的在线文档（飞书、腾讯文档、语雀、Notion、Google 文档）不抓取。</div>
        <div id="link-state" class="mt-4"></div>
      </div>
      <div id="import-result" class="mt-4"></div>
      <div class="flex items-center justify-between mt-5">
        <button class="link" id="sample">填入示例 PRD</button>
        <span class="flex gap-2"><button class="btn-outline" id="to-preview">调整拆分</button><button class="btn-primary" id="go-review">开始审查</button></span>
      </div>
    </div>
    <p class="text-xs text-slate-400 mt-4">文档内容只发送给审查用的模型（当前是 DeepSeek），不保存在服务器上；请不要粘贴涉密内容。</p></div>
    <div class="space-y-5">
      <div class="card p-6"><div class="label mb-3">没有 PRD？</div>
        <div class="text-sm text-slate-600 leading-relaxed">用一份开源项目的需求文档看看审查结果长什么样，不调用模型、不扣额度。</div>
        <button class="btn-primary w-full mt-4" id="sample-run">看示例结果</button></div>
      <div class="card p-6"><div class="label mb-3">检查什么</div><div id="rule-groups" class="space-y-4 text-sm"></div></div>
      <div class="card p-6" id="recent-box" hidden><div class="label mb-3">最近审查（只存在这台电脑）</div><div id="recent" class="space-y-1"></div></div>
    </div>
  </div>

  <!-- 第二步：拆分预览 -->
  <div id="step-preview" hidden></div>
  <!-- 第三步：审查中 / 结果 -->
  <div id="step-result" hidden></div>
</section>

<section id="tab-fb" hidden></section>
<section id="tab-dash" hidden></section>
<section id="tab-github" hidden></section>
</main>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RULES=/*RULES*/{"R1":"歧义措辞","R2":"不可验证","R3":"一条多需求","R4":"待定项未闭环","R5":"写了实现方式","R6":"指代不明","D1":"缺验收标准","D2":"缺异常处理","D3":"前后矛盾","A1":"缺失败次数限制","A2":"密码规则违背标准","A3":"登录状态缺失效时间","A4":"账号与权限操作缺日志"};
const RULE_INFO=/*RULE_INFO*/{};
// 严重程度：3 高 = 缺了会让开发或测试没法做、或违背安全标准；2 中 = 影响验收；1 低 = 措辞和写法
const SEVERITY={D1:3,D2:3,D3:3,R4:3,A1:3,A2:3,A3:3,A4:3,R2:2,R3:2,R6:2,R1:1,R5:1};
const SEV_NAME={3:'高',2:'中',1:'低'};
const SEV_TIP={3:'缺了会让开发或测试没法做，或违背安全标准',2:'影响验收：做完了也说不清对不对',1:'措辞或写法问题'};
const sevTag=r=>`<span class="sev sev-${SEVERITY[r]||1}" title="严重程度${SEV_NAME[SEVERITY[r]||1]}：${SEV_TIP[SEVERITY[r]||1]}">${SEV_NAME[SEVERITY[r]||1]}</span>`;
const KIND_RULES={sentence:['R1','R2','R3','R4','R5','R6'],doc:['D1','D2','D3'],account:['A1','A2','A3','A4']};
const KIND_NAME={sentence:'单句检查',doc:'整段检查',account:'账号与权限检查'};
let META={versions:{sentence:'v4',document:'doc_v1',account:'module_account_v3',model:'deepseek-chat'},quota:{perIp:500,remaining:500}};
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},del(k){try{localStorage.removeItem(k)}catch{}}};
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
async function post(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let j={};try{j=await r.json()}catch{}if(!r.ok){const e=new Error(j.error||('请求失败（'+r.status+'）'));e.status=r.status;e.code=j.code;throw e}return j}
function event(name,dim){try{navigator.sendBeacon('/api/event',new Blob([JSON.stringify({name,dim:dim||''})],{type:'application/json'}))}catch{}}
const verLine=()=>`单句规则 ${META.versions.sentence} · 文档级规则 ${META.versions.document} · 账号与权限 ${META.versions.account} · 模型 ${META.versions.model}`;
async function loadMeta(){try{META=await (await fetch('/api/meta')).json();$('#ver').textContent=verLine()}catch{}}
loadMeta();

/* ---------- 标签页 ---------- */
const TITLES={review:['工作台','审查'],fb:['维护','反馈复核'],dash:['维护','健康看板'],github:['维护','接入 GitHub']};
function showTab(t){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('tab-on',b.dataset.tab===t));$('#page-label').textContent=TITLES[t][0];$('#page-title').textContent=TITLES[t][1];$('#steps').style.display=t==='review'?'':'none';
  ['review','fb','dash','github'].forEach(x=>$('#tab-'+x).hidden=x!==t);if(t==='fb')loadFb();if(t==='dash')loadDash();if(t==='github')renderGithub()}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));

/* ---------- 导入（F1–F4） ---------- */
const DOC={name:'',source:'paste',docx:null,notices:[]};
let SAMPLE=null;
document.querySelectorAll('#import-tabs .subtab').forEach(b=>b.onclick=()=>{document.querySelectorAll('#import-tabs .subtab').forEach(x=>x.classList.toggle('on',x===b));
  ['paste','upload','link'].forEach(s=>$('#src-'+s).hidden=s!==b.dataset.src)});
function showPasteTab(){document.querySelector('#import-tabs [data-src=paste]').click()}
$('#prd').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey))$('#go-review').click()});
$('#prd').addEventListener('input',()=>{if(DOC.source==='paste'||DOC.source==='sample'){DOC.source='paste';DOC.name='';DOC.docx=null;DOC.notices=[]}});
$('#sample').onclick=async()=>{SAMPLE=SAMPLE||await (await fetch('sample.json')).json();seedSampleCache();$('#prd').value=SAMPLE.text;
  Object.assign(DOC,{name:'示例 PRD',source:'sample',docx:null,notices:[]});showPasteTab();importSummary()};
$('#sample-run').onclick=async()=>{await $('#sample').onclick();$('#go-review').click()};
function renderImportSide(){
  const groups=[['每条需求','sentence','NASA 需求编写检查清单'],['每个功能段落','doc','NASA 需求编写检查清单'],['账号与权限段落','account','NIST 数字身份标准']];
  $('#rule-groups').innerHTML=groups.map(([t,k,src])=>`<div><div class="flex justify-between text-slate-800 font-medium"><span>${t}</span><span class="text-xs text-slate-400 font-normal">${src}</span></div>
    <div class="flex flex-wrap gap-1.5 mt-2">${KIND_RULES[k].map(r=>`<span class="tag-gray" title="${esc((RULE_INFO[r]||{}).judge||'')}">${r} ${esc(RULES[r])}</span>`).join('')}</div></div>`).join('');
  const h=(store.get('history')||[]).slice().reverse();$('#recent-box').hidden=!h.length;
  $('#recent').innerHTML=h.map((r,i)=>{const c=counts(r);return `<button class="toc-item w-full text-left" data-hist="${h.length-1-i}"><span class="truncate">${esc(r.name)}<span class="block text-[11px] text-slate-400">${esc(r.time)}</span></span><span class="text-xs text-slate-500 shrink-0">${c.problems} 个问题</span></button>`}).join('');
  document.querySelectorAll('[data-hist]').forEach(b=>b.onclick=()=>{const all=store.get('history')||[];const r=all[+b.dataset.hist];if(!r)return;
    RES={...r,prev:all.slice(0,+b.dataset.hist).filter(x=>x.name===r.name).pop()||null};DOC.name=r.name;DOC.docx=null;
    SECS=r.sections.map(s=>({title:s.title,level:s.level,text:'',reqs:s.reqs.map(q=>q.text),skip:s.skipped,off:s.off,offReason:s.offReason,account:s.account,groups:s.groups,images:0,chars:0}));
    goStep('result');renderResult()})}
function importSummary(extra){const secs=PRDSplit.splitPrd($('#prd').value);const n=secs.filter(s=>!s.skip).length;const q=secs.reduce((a,s)=>a+(s.skip?0:s.reqs.length),0);
  $('#import-result').innerHTML=$('#prd').value.trim()?`<div class="text-sm text-slate-600 bg-slate-50 border border-slate-200 rounded-lg px-4 py-3">${extra?esc(extra)+'：':''}已识别 ${secs.length} 个段落、${q} 条需求${DOC.notices.length?'<br>'+DOC.notices.map(esc).join('<br>'):''}</div>`:''}

const MAX_FILE=20*1024*1024;
const drop=$('#drop');
['dragenter','dragover'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('over');$('#drop-title').textContent='松开即可上传'}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('over');$('#drop-title').textContent='点击选择文件，或把文件拖到这里'}));
drop.addEventListener('drop',ev=>{const f=ev.dataTransfer.files[0];if(f)handleFile(f)});
$('#file').onchange=e=>{const f=e.target.files[0];if(f)handleFile(f);e.target.value=''};
const setBusy=b=>{$('#to-preview').disabled=b;$('#go-review').disabled=b};
function uploadMsg(html){$('#upload-state').innerHTML=html}
function uploadError(msg){uploadMsg(`<div class="flex items-center justify-between gap-3 bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 text-sm"><span>${esc(msg)}</span><button class="btn-outline" onclick="document.getElementById('file').click()">重新上传</button></div>`);setBusy(false)}
const fmtSize=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
async function handleFile(f){const ext=(f.name.split('.').pop()||'').toLowerCase();
  if(!['md','txt','docx','pptx','pdf'].includes(ext)){event('import_fail','format');uploadError(ext==='doc'?'不支持 .doc 格式，请在 Word 里另存为 .docx 后再上传':'不支持这个格式，请另存为 .docx、.pptx 或 .pdf 后上传');return}
  if(f.size>MAX_FILE){event('import_fail','size');uploadError('文件超过 20 MB，请删去图片后再上传，或复制文字粘贴');return}
  event('import_start',ext);setBusy(true);
  const prog=p=>uploadMsg(`<div class="bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 text-sm"><div class="flex justify-between"><span>${esc(f.name)}</span><span class="text-slate-400">正在转换为文档结构… ${p}%</span></div><div class="h-1.5 bg-slate-200 rounded mt-2"><div class="h-1.5 bg-[#111111] rounded" style="width:${p}%"></div></div></div>`);
  prog(5);
  try{const buf=await f.arrayBuffer();const r=await fileToMd(buf,ext,prog);
    if(!r.md.trim()){event('import_fail','empty');uploadError('没有读到文字，请确认文件内容');return}
    Object.assign(DOC,{name:f.name,source:ext,docx:(r.kind==='docx'?buf:null),notices:r.notices});
    $('#prd').value=r.md;const secs=PRDSplit.splitPrd(r.md);const q=secs.reduce((a,s)=>a+(s.skip?0:s.reqs.length),0);
    if(!secs.some(s=>!s.skip&&s.reqs.length))event('import_fail','nosection');else event('import_ok',ext);
    uploadMsg(`<div class="flex items-center justify-between gap-3 bg-white border border-slate-200 rounded-lg px-4 py-3 text-sm"><div><div class="font-medium text-slate-800">${esc(f.name)} <span class="text-slate-400 font-normal">${fmtSize(f.size)}</span></div><div class="text-slate-500 mt-1">已识别 ${secs.length} 个段落、${q} 条需求${r.notices.length?'。'+r.notices.map(esc).join('；'):''}</div></div><button class="btn-outline" onclick="document.getElementById('file').click()">重新上传</button></div>`);
    $('#import-result').innerHTML='';setBusy(false)}
  catch(e){event('import_fail',e instanceof UserError?'user':'error');uploadError(e instanceof UserError?e.message:'没有读到文字，请确认文件内容（'+e.message+'）')}}



/* 导入链接（F3）：需要登录的在线文档不抓取 */
const LOGIN_HOSTS=[[/(^|\.)(feishu\.cn|larksuite\.com|feishu\.net)$/,'飞书'],[/(^|\.)docs\.qq\.com$/,'腾讯文档'],[/(^|\.)yuque\.com$/,'语雀'],[/(^|\.)(notion\.so|notion\.site)$/,'Notion'],[/^docs\.google\.com$/,'Google 文档']];
function linkMsg(html){$('#link-state').innerHTML=html}
const errBox=(t,extra)=>`<div class="bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 text-sm">${t}${extra||''}</div>`;
$('#fetch').onclick=async()=>{const u=$('#url').value.trim();if(!u)return;let host='';try{host=new URL(u).hostname}catch{linkMsg(errBox('这个链接打不开（链接格式不对），请下载文件后上传'));return}
  const login=LOGIN_HOSTS.find(([re])=>re.test(host));
  if(login){event('import_fail','login');const fs=login[1]==='飞书';
    linkMsg(errBox(`这个链接需要登录才能看，请在原平台导出为 Word（.docx）或 PDF 后上传。${fs?'<br>飞书的导出路径：在桌面端或网页版打开文档，点右上方「…」>「下载为」，可选 Word、PDF 或 Markdown。':''}`,fs?'<div class="mt-3"><button class="btn-outline" id="feishu-btn">从飞书导入</button></div>':''));
    if(fs)$('#feishu-btn').onclick=feishuModal;return}
  event('import_start','link');$('#fetch').disabled=true;setBusy(true);linkMsg('<div class="text-sm text-slate-500"><span class="spin"></span> 正在获取文档…</div>');
  try{const r=await post('/api/fetch',{url:u});let md=r.text||'';let notices=[];let label=r.label;
    if(r.base64){const bin=Uint8Array.from(atob(r.base64),c=>c.charCodeAt(0)).buffer;const x=await fileToMd(bin,r.ext);md=x.md;notices=x.notices;Object.assign(DOC,{docx:x.kind==='docx'?bin:null})}else DOC.docx=null;
    Object.assign(DOC,{name:u,source:'link',notices});$('#prd').value=md;const secs=PRDSplit.splitPrd(md);const q=secs.reduce((a,s)=>a+(s.skip?0:s.reqs.length),0);
    event('import_ok','link_'+(r.type||'web'));
    linkMsg(`<div class="bg-white border border-slate-200 rounded-lg px-4 py-3 text-sm"><span class="tag-blue">${esc(label)}</span> 已获取：${secs.length} 个段落、${q} 条需求${notices.length?'。'+notices.map(esc).join('；'):''}</div>`)}
  catch(e){event('import_fail','link_'+(e.code||'error'));linkMsg(errBox(esc(e instanceof UserError?e.message:e.message)))}
  $('#fetch').disabled=false;setBusy(false)};

/* 从飞书导入（F4）：授权 → 创建导出任务 → 等待导出 → 下载 */
function modal(html,wide){const bg=document.createElement('div');bg.className='modal-bg';bg.innerHTML=`<div class="bg-white rounded-xl shadow-xl w-full ${wide?'max-w-3xl':'max-w-md'} p-6 max-h-[90vh] overflow-auto">${html}</div>`;
  bg.addEventListener('click',e=>{if(e.target===bg)bg.remove()});document.body.appendChild(bg);bg.close=()=>bg.remove();return bg}
function feishuModal(){const m=modal(`<div class="text-base font-semibold mb-2">从飞书导入</div><p class="text-sm text-slate-600">需要授权读取你所选的这一份飞书文档，只读不改。导出的文件转成文字后立即丢弃，授权凭证不保存。</p>
  <div class="flex justify-end gap-2 mt-5"><button class="btn-outline" data-x>取消</button><button class="btn-primary" data-go>去飞书授权</button></div>`);
  m.querySelector('[data-x]').onclick=m.close;
  m.querySelector('[data-go]').onclick=async()=>{const u=$('#url').value.trim();
    const step=(a,b,c)=>`<div class="text-base font-semibold mb-3">从飞书导入</div><div class="space-y-2 text-sm">${[['创建导出任务',a],['等待飞书导出',b],['下载文档',c]].map(([t,s])=>`<div class="flex justify-between"><span>${t}</span><span class="${s==='✓'?'tag-success':s==='进行中'?'tag-blue':'tag-gray'}">${s}</span></div>`).join('')}</div>`;
    const box=m.firstElementChild;
    try{const st=await post('/api/feishu/start',{url:u});if(st.authUrl){location.href=st.authUrl;return}
      box.innerHTML=step('进行中','未开始','未开始');const task=await post('/api/feishu/export',{url:u,token:st.token});
      box.innerHTML=step('✓','进行中','未开始');let r;for(let i=0;i<30;i++){r=await post('/api/feishu/result',{ticket:task.ticket,token:st.token});if(r.done)break;await new Promise(z=>setTimeout(z,2000))}
      box.innerHTML=step('✓','✓','进行中');const bin=Uint8Array.from(atob(r.base64),c=>c.charCodeAt(0)).buffer;const x=await fileToMd(bin,'docx');
      Object.assign(DOC,{name:u,source:'feishu',docx:bin,notices:x.notices});$('#prd').value=x.md;m.close();linkMsg('');importSummary('已从飞书导入')}
    catch(e){box.innerHTML=`<div class="text-base font-semibold mb-2">从飞书导入</div>${errBox('飞书返回：'+esc(e.message))}<p class="text-sm text-slate-600 mt-3">可以改用手动导出：在飞书打开文档，点右上方「…」>「下载为」> Word，再在「上传文件」里上传。</p>
      <div class="flex justify-end gap-2 mt-5"><button class="btn-outline" data-x>关闭</button><button class="btn-primary" data-r>重试</button></div>`;box.querySelector('[data-x]').onclick=m.close;box.querySelector('[data-r]').onclick=()=>{m.close();feishuModal()}}}}

/* ---------- 拆分预览（F9、F10、F11） ---------- */
let SECS=[],CUR=0,EDIT=null;
const cacheKey=(kind,text)=>{const v=META.versions;const ver=kind==='sentence'?v.sentence:kind==='doc'?v.document:v.account;let h=0;const s=kind+'|'+ver+'|'+v.model+'|'+text;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return 'c:'+h.toString(36)+':'+s.length};
const cached=(kind,text)=>store.get(cacheKey(kind,text));
function seedSampleCache(){if(!SAMPLE||!SAMPLE.cache)return;for(const [kind,text,findings] of SAMPLE.cache)store.set(cacheKey(kind,text),findings)}
const allJobs=()=>SECS.flatMap((s,i)=>PRDSplit.jobsFor(s,i));
const callCount=jobs=>jobs.filter(j=>!cached(j.kind,j.text)).length;
$('#go-review').onclick=async()=>{if(!preparePreview())return;SECS.forEach(x=>{if(x.offReason==='quota'){x.off=false;x.offReason=''}});QUOTA_NOTE='';event('preview',DOC.source);await startReview(allJobs())};
$('#to-preview').onclick=()=>{if(!preparePreview())return;event('preview',DOC.source);goStep('preview');renderPreview()};
// 拆分并按额度勾选段落；没有内容时提示并返回 false
function preparePreview(){const text=$('#prd').value.trim();if(!text){toast('请先粘贴、上传或导入 PRD');return false}
  SECS=PRDSplit.splitPrd(text);if(!SECS.length){toast('没有拆出段落');return false}
  if(!DOC.name)DOC.name=(SECS[0].title&&SECS[0].title!=='（无标题）')?SECS[0].title:'粘贴的 PRD';
  fitQuota();CUR=Math.max(0,SECS.findIndex(s=>!s.skip&&s.reqs.length));return true}
let QUOTA_NOTE='';
// 本次调用次数超过今天剩余额度时，按文档顺序勾选到额度用完为止
function fitQuota(){QUOTA_NOTE='';const left=META.quota.remaining;let used=0,n=0;
  SECS.forEach((s,i)=>{if(s.skip)return;const c=callCount(PRDSplit.jobsFor({...s,off:false},i));if(used+c>left){if(!s.off){s.off=true;s.offReason='quota'}}else{used+=c;if(c)n++}});
  if(SECS.some(s=>s.offReason==='quota'))QUOTA_NOTE=`今天的额度只够审前 ${n} 个段落，可以改选要审的段落`}
function goStep(s){['import','preview','result'].forEach(x=>$('#step-'+x).hidden=x!==s);window.scrollTo(0,0);
  $('#steps').innerHTML=[['import','导入'],['preview','拆分预览'],['result','审查结果']].map(([k,t],i)=>`<span class="chip ${k===s?'on':''}" style="cursor:default">${i+1}  ${t}</span>`).join('')}
// 大号数字：小数部分和单位用浅灰
const bigNum=(v,unit)=>{const t=String(v);const m=t.match(/^(\d[\d,]*)(\.\d+)?(.*)$/);return m?`<span class="num">${m[1]}${m[2]?`<span class="dim">${m[2]}</span>`:''}${m[3]||unit?`<span class="dim text-[0.45em] ml-1 tracking-normal">${m[3]||''}${unit||''}</span>`:''}</span>`:`<span class="num">${esc(t)}</span>`};
const stat=(label,v,unit,sub)=>`<div class="min-w-[120px]"><div class="label mb-2">${label}</div><div class="text-[40px]">${bigNum(v,unit)}</div>${sub?`<div class="text-xs text-slate-400 mt-1.5">${sub}</div>`:''}</div>`;
function renderPreview(){const jobs=allJobs();const calls=callCount(jobs);const func=SECS.filter(s=>!s.skip).length;const reqN=SECS.reduce((a,s)=>a+(s.skip||s.off?0:s.reqs.length),0);
  const skipped=SECS.filter(s=>s.skip).length;const images=SECS.reduce((a,s)=>a+s.images,0);const over=!!META.quota.perIp&&calls>META.quota.remaining;
  const notices=[...DOC.notices.map(n=>['blue',n]),...(images?[['gray',`有 ${images} 张图片未审查`]]:[]),...(QUOTA_NOTE?[['warning',QUOTA_NOTE]]:[]),...(over?[['warning',`本次将调用模型 ${calls} 次，超过今天剩余额度 ${META.quota.remaining} 次；额度用完后的条目会标为「未审查」，第二天可以接着审`]]:[])];
  const s=SECS[CUR]||{reqs:[]};
  $('#step-preview').innerHTML=`
  <div class="card px-6 py-5 flex items-end justify-between gap-6 flex-wrap mb-4">
    <div class="flex gap-10 flex-wrap">${stat('段落',SECS.length,' 个',`跳过 ${skipped} 个 · 功能段落 ${func} 个`)}${stat('需求',reqN,' 条')}${stat('本次调用模型',calls,' 次')}${META.quota.perIp?stat('今天剩余额度',META.quota.remaining,' 次'):stat('今天剩余额度','不限')}</div>
    <div class="flex gap-2"><button class="btn-outline" id="back-import">返回修改</button><button class="btn-primary" id="start" ${!jobs.length?'disabled':''}>开始审查</button></div>
  </div>
  ${notices.map(([c,t])=>`<div class="mb-3 px-4 py-2.5 rounded-lg text-sm ${c==='warning'?'bg-amber-50 border border-amber-200 text-amber-800':c==='blue'?'bg-blue-50 border border-blue-200 text-blue-800':'bg-slate-50 border border-slate-200 text-slate-600'}">${esc(t)}</div>`).join('')}
  <div class="narrow-only mb-3"><select id="sec-select" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm bg-white">${SECS.map((x,i)=>`<option value="${i}" ${i===CUR?'selected':''}>${esc(x.title)}（${x.skip?'已跳过':x.off?'未勾选':x.reqs.length+' 条'}）</option>`).join('')}</select></div>
  <div class="split grid gap-4" style="grid-template-columns:380px 1fr">
    <div class="card p-3 wide-only max-h-[70vh] overflow-auto">${SECS.map((x,i)=>tocRow(x,i)).join('')}</div>
    <div class="card p-5">${secDetail(s,CUR)}</div>
  </div>`;
  $('#back-import').onclick=()=>{goStep('import');renderImportSide()};$('#start').onclick=()=>startReview(allJobs());
  const sel=$('#sec-select');if(sel)sel.onchange=()=>{CUR=+sel.value;renderPreview()};
  document.querySelectorAll('[data-toc]').forEach(el=>el.onclick=e=>{if(e.target.closest('input,button'))return;CUR=+el.dataset.toc;EDIT=null;renderPreview()});
  document.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{const x=SECS[+el.dataset.check];x.off=!el.checked;x.offReason=x.off?'user':'';QUOTA_NOTE='';renderPreview()});
  bindDetail()}
function tocRow(x,i){const tag=x.skip?`<span class="tag-gray">已跳过</span>`:x.codeOnly?`<span class="tag-gray">代码块，不审查</span>`:x.off?`<span class="tag-gray">未勾选</span>`:`<span class="tag-blue">${x.reqs.length} 条</span>`;
  return `<div class="toc-item ${i===CUR?'on':''} ${x.skip?'opacity-60':''}" data-toc="${i}" style="padding-left:${6+(x.level-1)*14}px">
    <label class="flex items-start gap-2 min-w-0"><input type="checkbox" data-check="${i}" ${x.skip?'disabled':''} ${!x.skip&&!x.off?'checked':''} class="mt-1"><span class="truncate">${esc(x.title)}${x.skip?`<span class="block text-[11px] text-slate-400 font-normal">标题含「${esc(x.skipReason)}」</span>`:''}${!x.skip&&x.account?'<span class="block text-[11px] text-[#111111] font-normal">账号与权限检查</span>':''}</span></label>${tag}</div>`}
function secDetail(s,i){if(!s)return '';const jobs=PRDSplit.jobsFor(s,i);
  const long=s.groups.length>1&&!s.skip?`<div class="mb-3 px-3 py-2 rounded bg-slate-50 border border-slate-200 text-xs text-slate-600">本段 ${s.chars} 字，已分成 ${s.groups.length} 组整段检查；跨组的前后矛盾不检查</div>`:'';
  return `<div class="flex items-center justify-between gap-3 flex-wrap mb-3"><div class="font-semibold text-slate-800">${esc(s.title)}</div>
    <div class="flex items-center gap-3 text-sm">${s.skip?`<button class="btn-outline" id="unskip">改为审查</button>`:`<label class="flex items-center gap-1.5 text-slate-600"><input type="checkbox" id="acc" ${s.account?'checked':''}>账号与权限检查</label>`}</div></div>
  ${s.account&&!s.skip?'<div class="mb-3 text-xs text-[#111111]">标题或正文含登录、密码、权限等词，已自动勾选账号与权限规则组（A1–A4），可以取消。</div>':''}
  ${long}
  <div class="text-xs text-slate-400 mb-2">${s.skip?'这个段落被跳过：标题含「'+esc(s.skipReason)+'」。':s.off?'这个段落未勾选，不审查。':`要做 ${jobs.length} 项检查（${[jobs.filter(j=>j.kind==='doc').length&&'整段检查 '+jobs.filter(j=>j.kind==='doc').length+' 项',jobs.filter(j=>j.kind==='account').length&&'账号与权限 '+jobs.filter(j=>j.kind==='account').length+' 项','单句 '+s.reqs.length+' 项'].filter(Boolean).join('、')}）${callCount(jobs)<jobs.length?`，其中 ${jobs.length-callCount(jobs)} 项用本机已有结果，调用模型 ${callCount(jobs)} 次`:''}`}</div>
  ${s.reqs.length?`<div class="divide-y divide-slate-100 border border-slate-100 rounded-lg">${s.reqs.map((r,ri)=>EDIT===ri?
    `<div class="p-3"><textarea id="edit-text" class="w-full border border-slate-300 rounded p-2 text-sm h-20">${esc(r)}</textarea><div class="flex gap-2 mt-2"><button class="btn-primary" id="edit-save">保存</button><button class="btn-outline" id="edit-cancel">取消</button></div></div>`:
    `<div class="p-3 flex justify-between gap-3 text-sm ${s.skip?'text-slate-400':'text-slate-700'}"><span>${esc(r)}</span><span class="flex gap-3 shrink-0"><button class="link" data-edit="${ri}">编辑</button><button class="link text-red-600" data-delreq="${ri}">删除</button></span></div>`).join('')}</div>`:'<div class="text-sm text-slate-400">这个段落没有拆出需求。</div>'}`}
function bindDetail(){const s=SECS[CUR];if(!s)return;
  const un=$('#unskip');if(un)un.onclick=()=>{s.skip=false;s.off=false;renderPreview()};
  const acc=$('#acc');if(acc)acc.onchange=()=>{s.account=acc.checked;renderPreview()};
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{EDIT=+b.dataset.edit;renderPreview()});
  document.querySelectorAll('[data-delreq]').forEach(b=>b.onclick=()=>{s.reqs.splice(+b.dataset.delreq,1);EDIT=null;renderPreview()});
  const sv=$('#edit-save');if(sv){sv.onclick=()=>{const t=$('#edit-text').value.trim();if(t)s.reqs[EDIT]=t;EDIT=null;renderPreview()};$('#edit-cancel').onclick=()=>{EDIT=null;renderPreview()}}}

/* ---------- 审查（F11、F12、F13） ---------- */
let RES=null,RUNNING=false,STOP=false;
window.addEventListener('beforeunload',e=>{if(RUNNING){e.preventDefault();e.returnValue=''}});
function newResult(){return{name:DOC.name,source:DOC.source,text:$('#prd').value,time:new Date().toLocaleString('zh-CN',{hour12:false}),versions:{...META.versions},
  sections:SECS.map(s=>({title:s.title,level:s.level,skipped:s.skip,off:!!s.off,offReason:s.offReason||'',account:s.account,groups:s.groups,
    doc:s.reqs.length>=2&&!s.skip?s.groups.map(()=>({status:s.off?'off':'pending',findings:[]})):[],
    acc:s.account&&!s.skip?s.groups.map(()=>({status:s.off?'off':'pending',findings:[]})):[],
    reqs:s.reqs.map(t=>({text:t,status:s.skip?'skip':s.off?'off':'pending',findings:[]}))}))}}
const slot=(R,j)=>{const s=R.sections[j.si];return j.kind==='doc'?s.doc[j.gi]:j.kind==='account'?s.acc[j.gi]:s.reqs[j.ri]};
async function pool(items,n,fn){let i=0;await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{while(i<items.length&&!STOP){const k=i++;await fn(items[k])}}))}
async function startReview(jobs){RES=newResult();RES.prev=findPrevious(RES.name);event('review_start',String(jobs.length));event('items',String(jobs.length));await runJobs(jobs)}
async function runJobs(jobs){RUNNING=true;STOP=false;let quotaOut=false;const t0=Date.now();let done=0;goStep('result');
  RES.total=jobs.length;const tick=()=>{renderRunning(done,jobs.length,Math.round((Date.now()-t0)/1000))};tick();const timer=setInterval(tick,1000);
  await pool(jobs,6,async j=>{const sl=slot(RES,j);const c=cached(j.kind,j.text);
    if(c){sl.findings=c;sl.status='done';sl.cached=true}
    else if(quotaOut){sl.status='quota'}
    else{try{const r=await post('/api/item',{kind:j.kind,text:j.text});sl.findings=r.findings;sl.status='done';store.set(cacheKey(j.kind,j.text),r.findings)}
      catch(e){if(e.status===429){quotaOut=true;sl.status='quota';event('quota_out')}else{sl.status='failed';sl.error=e.message;event('item_fail',String(e.status||'net'))}}}
    done++});
  if(STOP)jobs.forEach(j=>{const sl=slot(RES,j);if(sl.status==='pending')sl.status='stopped'});
  clearInterval(timer);RUNNING=false;RES.seconds=Math.round((Date.now()-t0)/1000);
  const incomplete=jobs.some(j=>slot(RES,j).status!=='done');event(incomplete?'review_incomplete':'review_complete',quotaOut?'quota':STOP?'stopped':incomplete?'error':'');
  saveHistory(RES);loadMeta().then(()=>{});renderResult()}

/* ---------- 修改建议（F18） ---------- */
function diff(a,b){const A=[...a],B=[...b],n=A.length,m=B.length;const d=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)d[i][j]=A[i]===B[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
  let i=0,j=0,L='',R='';while(i<n||j<m){if(i<n&&j<m&&A[i]===B[j]){L+=esc(A[i]);R+=esc(B[j]);i++;j++}else if(j<m&&(i>=n||d[i][j+1]>=d[i+1][j])){R+=`<span class="ins">${esc(B[j])}</span>`;j++}else{L+=`<span class="del">${esc(A[i])}</span>`;i++}}
  return[L.replace(/<\/span><span class="del">/g,''),R.replace(/<\/span><span class="ins">/g,'')]}
const sugKey=t=>'s:'+cacheKey('suggest',t);
const savedSuggestion=t=>store.get(sugKey(t));
async function getSuggestion(r){let s=savedSuggestion(r.text);if(s)return s;
  s=(await post('/api/suggest',{text:r.text,findings:r.findings.map(f=>({rule:f.rule,name:RULES[f.rule],reason:f.reason}))})).rewrite;store.set(sugKey(r.text),s);return s}
// 把一条需求换成建议改写（可能拆成几条），预览和结果里同时换
function adoptSuggestion(si,r,s){const lines=s.split('\n').map(x=>x.trim()).filter(Boolean);const sec=SECS[si];const i=sec.reqs.indexOf(r.text);if(i>=0)sec.reqs.splice(i,1,...lines);
  const rs=RES.sections[si].reqs;const k=rs.indexOf(r);r.text=lines[0];r.adopted=true;rs.splice(k+1,0,...lines.slice(1).map(t=>({text:t,status:'pending',findings:[],adopted:true})))}
const flaggedReqs=()=>RES.sections.flatMap((s,si)=>s.skipped?[]:s.reqs.filter(r=>r.status==='done'&&r.findings.length&&!r.adopted).map(r=>({s,si,r})));
async function suggest(ctx,box,btn){btn.disabled=true;box.innerHTML='<div class="text-xs text-slate-500 mt-2"><span class="spin"></span> 正在生成修改建议…</div>';
  const r=RES.sections[ctx.si].reqs[ctx.ri];
  try{const s=await getSuggestion(r);
    const [L,Rr]=diff(r.text,s);const multi=s.includes('\n');
    box.innerHTML=`<div class="mt-3 grid md:grid-cols-2 gap-3 text-sm"><div class="bg-white border border-slate-200 rounded p-3"><div class="text-xs text-slate-400 mb-1">原文</div>${L}</div><div class="bg-white border border-blue-200 rounded p-3"><div class="text-xs text-slate-400 mb-1">建议改写${multi?'（拆成 '+s.split('\n').length+' 条）':''}</div><div class="whitespace-pre-wrap">${Rr}</div></div></div>
      <div class="flex gap-2 mt-2"><button class="btn-outline !text-xs" data-copy>复制</button><button class="btn-primary !text-xs" data-adopt>采用</button></div>`;
    box.querySelector('[data-copy]').onclick=()=>{navigator.clipboard.writeText(s).then(()=>toast('已复制'))};
    box.querySelector('[data-adopt]').onclick=()=>{adoptSuggestion(ctx.si,r,s);renderResult();toast('已采用，点「重新审查」确认问题是否解决')}}
  catch(e){box.innerHTML=`<div class="text-xs text-red-600 mt-2">${esc(e.message)}</div>`;btn.disabled=false}}

// 批量：为所有有问题的需求生成建议，勾选后一起采用并重新审查（没改的条目用本机结果，不再调用模型）
async function genAll(list,onStep){let done=0,fail=0;let i=0;
  await Promise.all(Array.from({length:4},async()=>{while(i<list.length){const it=list[i++];try{it.sug=await getSuggestion(it.r)}catch(e){it.err=e.message;fail++}done++;onStep&&onStep(done,fail)}}));return fail}
function batchModal(){const list=flaggedReqs();if(!list.length){toast('没有可以改写的需求');return}

    <button class="btn-primary" id="b-gen" ${need?'':'hidden'}>生成全部建议</button></div>
    <div id="b-list" class="space-y-3 max-h-[60vh] overflow-auto pr-1"></div>

  const draw=()=>{list.forEach(it=>{it.sug=it.sug||savedSuggestion(it.r.text)});
    $('#b-list').innerHTML=list.map((it,i)=>{const [L,R]=it.sug?diff(it.r.text,it.sug):[esc(it.r.text),''];
      return `<label class="block border border-slate-200 rounded-lg p-3 ${it.sug?'cursor-pointer':''}"><div class="flex items-center gap-2 text-xs text-slate-400 mb-2">${it.sug?`<input type="checkbox" data-b="${i}" ${it.pick!==false?'checked':''}>`:''}<span>${esc(it.s.title)}</span>${it.r.findings.map(f=>sevTag(f.rule)+`<span class="tag-danger">${f.rule} ${esc(RULES[f.rule])}</span>`).join('')}</div>
      <div class="grid md:grid-cols-2 gap-3 text-sm"><div>${L}</div><div class="whitespace-pre-wrap">${it.sug?R:it.err?`<span class="text-red-600 text-xs">${esc(it.err)}</span>`:'<span class="text-slate-400 text-xs">还没生成</span>'}</div></div></label>`}).join('');
    document.querySelectorAll('[data-b]').forEach(c=>c.onchange=()=>{list[+c.dataset.b].pick=c.checked});
    $('#b-adopt').disabled=!list.some(it=>it.sug)};
  draw();m.querySelector('[data-x]').onclick=m.close;
  $('#b-all').onchange=e=>{list.forEach(it=>it.pick=e.target.checked);draw()};
  $('#b-gen').onclick=async e=>{e.target.disabled=true;await genAll(list,(d,f)=>{e.target.textContent=`正在生成 ${d} / ${list.length}${f?`，失败 ${f}`:''}`});e.target.hidden=true;draw()};
  $('#b-adopt').onclick=async()=>{const pick=list.filter(it=>it.sug&&it.pick!==false);if(!pick.length){toast('没有选中的建议');return}
    pick.forEach(it=>adoptSuggestion(it.si,it.r,it.sug));m.close();event('adopt_all',String(pick.length));await startReview(allJobs())}}

/* ---------- 导出评审意见（F15） ---------- */
function reviewText(fmt,withSug){const R=RES;const L=[];const md=fmt==='md';const cell=t=>String(t||'').replace(/\|/g,'\\|').replace(/\n+/g,' ');
  L.push(md?`# 评审意见：${R.name}`:`评审意见：${R.name}`,'',`- 审查时间：${R.time}`,`- 规则版本：单句 ${R.versions.sentence}，文档级 ${R.versions.document}，账号与权限 ${R.versions.account}`,`- 模型：${R.versions.model}`,'');
  let n=0;const rows=[];const left=[];
  R.sections.forEach(s=>{if(s.skipped)return;const add=(x,text)=>{if(x.status==='done')x.findings.forEach(f=>{n++;const row=[s.title,text,`${f.rule} ${RULES[f.rule]||''}`,SEV_NAME[SEVERITY[f.rule]||1],f.reason];if(withSug)row.push(x.text?(savedSuggestion(x.text)||''):'');rows.push(row)});else if(['off','quota','failed','stopped'].includes(x.status))left.push([s.title,text,{off:'未勾选',quota:'额度用完',failed:'审查失败'+(x.error?'：'+x.error:''),stopped:'已停止'}[x.status]])};
    s.doc.forEach((d,gi)=>add(d,'（整段检查'+(s.doc.length>1?' 第 '+(gi+1)+' 组':'')+'）'));s.acc.forEach((d,gi)=>add(d,'（账号与权限检查'+(s.acc.length>1?' 第 '+(gi+1)+' 组':'')+'）'));s.reqs.forEach(r=>add(r,r.text))});
  if(md){L.push(`## 问题（${n} 条）`,'',`| 段落 | 需求原文 | 规则 | 严重程度 | 理由 |${withSug?' 建议改写 |':''}`,`| --- | --- | --- | --- | --- |${withSug?' --- |':''}`,...rows.map(r=>'| '+r.map(cell).join(' | ')+' |'))}
  else{L.push(`问题（${n} 条）`,'');rows.forEach((r,i)=>{L.push(`${i+1}. 【${r[0]}】${r[1]}`,`   ${r[2]}（严重程度${r[3]}）：${r[4]}`);if(r[5])L.push(`   建议改写：${r[5].replace(/\n/g,'；')}`)})}
  L.push('');if(left.length){if(md)L.push(`## 未审查（${left.length} 项）`,'','| 段落 | 条目 | 原因 |','| --- | --- | --- |',...left.map(r=>'| '+r.map(cell).join(' | ')+' |'));else{L.push(`未审查（${left.length} 项）`);left.forEach(r=>L.push(`- 【${r[0]}】${r[1]}：${r[2]}`))}}
  return{text:L.join('\n'),n}}
function exportModal(){let fmt='md',withSug=true;const missing=()=>flaggedReqs().filter(x=>!savedSuggestion(x.r.text));
  const m=modal(`<div class="flex justify-between items-center mb-3"><div class="text-base font-semibold">导出评审意见</div>
  <div class="flex gap-3 text-sm"><label><input type="radio" name="fmt" value="md" checked> Markdown</label><label><input type="radio" name="fmt" value="txt"> 纯文本</label></div></div>
  <div class="flex items-center justify-between gap-3 text-sm mb-3"><label class="flex items-center gap-2"><input type="checkbox" id="exp-sug" checked>附上修改建议</label>

    const g=$('#exp-gen');if(g)g.onclick=async()=>{g.disabled=true;const list=missing();await genAll(list,d=>{g.textContent=`生成中 ${d} / ${list.length}`});show()}};show();
  $('#exp-sug').onchange=e=>{withSug=e.target.checked;show()};

  m.querySelector('[data-dl]').onclick=()=>{const r=reviewText(fmt,withSug);download(new Blob([r.text],{type:'text/plain;charset=utf-8'}),fileBase()+'-评审意见.'+(fmt==='md'?'md':'txt'));event('export',fmt)}}
const fileBase=()=>(RES.name||'PRD').replace(/^https?:\/\//,'').replace(/\.[a-z]+$/i,'').replace(/[\\/:*?"<>|]+/g,'_').slice(0,60);
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

/* ---------- Word 批注版（F16） ---------- */
const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
const normT=t=>t.replace(/\s+/g,'').replace(/[*`]/g,'');
async function exportDocx(){if(!DOC.docx)return;try{
  const zip=await JSZip.loadAsync(DOC.docx);const dx=new DOMParser().parseFromString(await zip.file('word/document.xml').async('string'),'application/xml');
  let cx=zip.file('word/comments.xml')?new DOMParser().parseFromString(await zip.file('word/comments.xml').async('string'),'application/xml'):null;
  if(!cx){cx=new DOMParser().parseFromString(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:comments xmlns:w="${W}"/>`,'application/xml');
    zip.file('word/_rels/document.xml.rels',(await zip.file('word/_rels/document.xml.rels').async('string')).replace('</Relationships>','<Relationship Id="rIdAiPrdComments" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/comments" Target="comments.xml"/></Relationships>'));
    const ct=await zip.file('[Content_Types].xml').async('string');if(!ct.includes('/word/comments.xml'))zip.file('[Content_Types].xml',ct.replace('</Types>','<Override PartName="/word/comments.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.comments+xml"/></Types>'))}
  let id=Math.max(0,...qn(cx,'w:comment').map(c=>+c.getAttribute('w:id')||0))+1;
  const paras=qn(dx,'w:p');const ptext=paras.map(p=>normT(wText(p)));
  const findPara=t=>{const k=normT(t);if(!k)return -1;let i=ptext.findIndex(x=>x&&x.includes(k));if(i<0&&k.length>12)i=ptext.findIndex(x=>x&&x.includes(k.slice(0,12)));return i};
  const findHead=title=>ptext.findIndex(x=>x===normT(title));
  const el=(n,attrs={})=>{const e=dx.createElementNS(W,'w:'+n);for(const [k,v] of Object.entries(attrs))e.setAttributeNS(W,'w:'+k,v);return e};
  const addComment=(p,text)=>{const c=cx.createElementNS(W,'w:comment');c.setAttributeNS(W,'w:id',id);c.setAttributeNS(W,'w:author','AI 审 PRD');c.setAttributeNS(W,'w:initials','AI');c.setAttributeNS(W,'w:date',new Date().toISOString().slice(0,19)+'Z');
    text.split('\n').forEach(line=>{const cp=cx.createElementNS(W,'w:p');const r=cx.createElementNS(W,'w:r');const t=cx.createElementNS(W,'w:t');t.setAttribute('xml:space','preserve');t.textContent=line;r.appendChild(t);cp.appendChild(r);c.appendChild(cp)});
    cx.documentElement.appendChild(c);
    const pPr=qn(p,'w:pPr')[0];const start=el('commentRangeStart',{id:String(id)});if(pPr)pPr.after(start);else p.insertBefore(start,p.firstChild);
    p.appendChild(el('commentRangeEnd',{id:String(id)}));const r=el('r');const rPr=el('rPr');rPr.appendChild(el('rStyle',{val:'CommentReference'}));r.appendChild(rPr);r.appendChild(el('commentReference',{id:String(id)}));p.appendChild(r);id++};
  let n=0,moved=0;
  RES.sections.forEach(s=>{const items=[...s.doc.map(d=>[d,null]),...s.acc.map(d=>[d,null]),...s.reqs.map(r=>[r,r.text])];
    items.forEach(([x,text])=>{if(x.status!=='done')return;x.findings.forEach(f=>{let pi=text?findPara(text):findHead(s.title);let body=`${f.rule} ${RULES[f.rule]||''}：${f.reason}`;
      if(pi<0){pi=findHead(s.title);if(text)body+=`\n原句在文档里找不到，批注加在所在段落标题上。原句：${text}`;moved++}if(pi<0)return;addComment(paras[pi],body);n++})})});
  const ser=new XMLSerializer();zip.file('word/document.xml',ser.serializeToString(dx));zip.file('word/comments.xml',ser.serializeToString(cx));
  download(await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}),fileBase()+'-批注.docx');
  event('export','docx');toast(`已导出 ${n} 条批注${moved?`，其中 ${moved} 条加在段落标题上`:''}`)}catch(e){toast('导出失败：'+e.message)}}

/* ---------- 反馈复核（F19–F21） ---------- */
const FB={status:'',type:'',rule:'',level:'',version:''};
async function loadFb(){const q=new URLSearchParams(Object.entries(FB).filter(([,v])=>v));let r;
  try{r=await (await fetch('/api/feedback?'+q)).json()}catch{r={feedback:[],cases:0,versions:[]}}
  const sel=(k,label,opts)=>`<label class="block text-xs text-slate-500 mb-3">${label}<select data-fb="${k}" class="w-full mt-1 border border-slate-200 rounded px-2 py-1.5 text-sm bg-white text-slate-700"><option value="">全部</option>${opts.map(([v,t])=>`<option value="${v}" ${FB[k]===v?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`;
  const filters=sel('status','状态',[['pending','待复核'],['accepted','已采纳'],['rejected','已驳回']])+sel('type','类型',[['false_positive','误判'],['missed','漏报']])+sel('rule','规则',Object.keys(RULES).map(k=>[k,k+' '+RULES[k]]))+sel('level','单条或整段',[['sentence','单条需求'],['doc','整段'],['account','账号与权限']])+sel('version','规则版本',(r.versions||[]).map(v=>[v,v]));
  $('#tab-fb').innerHTML=`<div class="flex justify-between items-center mb-4 gap-3 flex-wrap"><div class="text-sm text-slate-500">共 ${r.feedback.length} 条 · 已采纳并写成评测用例 ${r.cases} 条 · 采纳和驳回需要复核口令</div><button class="btn-outline" id="fb-export">导出已采纳用例</button></div>
  <div class="split grid gap-4" style="grid-template-columns:240px 1fr"><div class="card p-4 self-start fb-filters">${filters}</div>
  <div class="space-y-3">${r.feedback.length?r.feedback.map(fbCard).join(''):`<div class="card p-16 text-center"><div class="text-4xl mb-3">🗂️</div><div class="text-slate-500">还没有反馈</div></div>`}</div></div>`;
  document.querySelectorAll('[data-fb]').forEach(s=>s.onchange=()=>{FB[s.dataset.fb]=s.value;loadFb()});
  document.querySelectorAll('[data-resolve]').forEach(b=>b.onclick=()=>resolve(b.dataset.id,b.dataset.resolve));
  $('#fb-export').onclick=exportCases}
const LEVEL={sentence:'单条需求',doc:'整段',account:'账号与权限'};
function fbCard(f){const v=f.versions||{};const pred=(f.predicted||[]).map(k=>`<span class="tag-danger">${k} ${esc(RULES[k]||'')}</span>`).join(' ')||'<span class="tag-success">未发现问题</span>';
  return `<div class="card p-4"><div class="flex justify-between gap-3 flex-wrap text-xs text-slate-500"><span><span class="${f.status==='pending'?'tag-warning':f.status==='accepted'?'tag-success':'tag-gray'}">${{pending:'待复核',accepted:'已采纳',rejected:'已驳回'}[f.status]}</span> ${esc(f.time)} · ${LEVEL[f.level]||f.level} · ${f.type==='false_positive'?'误判':'漏报'}</span><span>${esc([v.sentence,v.document,v.account,v.model].filter(Boolean).join(' · '))}</span></div>
    <div class="text-sm text-slate-800 mt-2 whitespace-pre-wrap max-h-40 overflow-auto">${esc(f.text)}</div>
    <div class="text-xs text-slate-500 mt-2">模型结果：${pred}</div>
    <div class="text-xs text-slate-500 mt-1">用户反馈：${f.type==='false_positive'?'认为不该报':'认为漏了'} <b class="text-slate-700">${esc(f.rule)} ${esc(RULES[f.rule]||'')}</b>${f.note?'，'+esc(f.note):''}</div>
    ${f.status==='accepted'?'<div class="text-xs text-green-700 mt-2">已写成评测用例</div>':''}${f.status==='rejected'?`<div class="text-xs text-slate-500 mt-2">驳回原因：${esc(f.reason||'未填写')}</div>`:''}
    ${f.status==='pending'?`<div class="flex gap-2 mt-3"><button class="btn-primary !text-xs" data-resolve="accept" data-id="${f.id}">采纳</button><button class="btn-outline !text-xs" data-resolve="reject" data-id="${f.id}">驳回</button></div>`:''}</div>`}
function askKey(extra){return new Promise(res=>{let k='';try{k=localStorage.getItem('reviewKey')||''}catch{}
  const m=modal(`<div class="text-base font-semibold mb-3">${extra?'驳回反馈':'输入复核口令'}</div>${extra?'<textarea id="rj-reason" class="w-full border border-slate-200 rounded p-2 text-sm h-16 mb-3" placeholder="驳回原因"></textarea>':''}<input id="rv-key" type="password" class="w-full border border-slate-200 rounded px-3 py-2 text-sm" placeholder="复核口令" value="${esc(k)}"><div class="flex justify-end gap-2 mt-4"><button class="btn-outline" data-x>取消</button><button class="btn-primary" data-ok>确定</button></div>`);
  m.querySelector('[data-x]').onclick=()=>{m.close();res(null)};m.querySelector('[data-ok]').onclick=()=>{const v={key:$('#rv-key').value,reason:extra?$('#rj-reason').value.trim():''};m.close();res(v)}})}
async function resolve(id,dec){const a=await askKey(dec==='reject');if(!a||!a.key)return;
  try{await post('/api/feedback/resolve',{id,decision:dec,key:a.key,reason:a.reason});store.set('reviewKey',a.key);try{localStorage.setItem('reviewKey',a.key)}catch{}toast(dec==='accept'?'已采纳，已写成评测用例':'已驳回')}
  catch(e){try{localStorage.removeItem('reviewKey')}catch{}toast(e.message)}loadFb();pending()}
async function exportCases(){const a=await askKey(false);if(!a||!a.key)return;
  try{const r=await fetch('/api/feedback/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:a.key})});if(!r.ok)throw new Error((await r.json()).error);
    try{localStorage.setItem('reviewKey',a.key)}catch{}download(await r.blob(),'feedback_cases.jsonl')}catch(e){toast(e.message)}}
async function pending(){try{const r=await (await fetch('/api/feedback?status=pending')).json();$('#pend').textContent=r.feedback.length?`(${r.feedback.length})`:''}catch{}}
pending();

/* ---------- 健康看板 ---------- */
// 健康看板里三组规则的颜色
const RULE_GROUPS=[{name:'单句规则',ids:['R1','R2','R3','R4','R5','R6'],color:'#111111'},{name:'文档级规则',ids:['D1','D2','D3'],color:'#3e63dd'},{name:'账号与权限',ids:['A1','A2','A3','A4'],color:'#30a46c'}];
async function loadDash(){let d={},m={};try{d=await (await fetch('dashboard.json')).json()}catch{}try{m=await (await fetch('/api/metrics')).json()}catch{}
  const pct=x=>x==null?'—':(x*100).toFixed(1)+'%';const f3=x=>x==null?'—':x.toFixed(3);
  const card=(t,v,sub)=>`<div class="card p-6"><div class="label">${t}</div><div class="text-[44px] mt-4">${bigNum(v)}</div><div class="text-xs text-slate-400 mt-3">${sub||''}</div></div>`;
  const C=d.cards||{};const rules=d.rules||[];
  $('#tab-dash').innerHTML=`
  <div class="grid grid-cols-2 xl:grid-cols-4 gap-4 mb-4">${card('单句规则 F1',f3(C.sentence&&C.sentence.f1),C.sentence?`${C.sentence.version} · 留出集 ${C.sentence.items} 条`:'')}${card('文档级规则 F1',f3(C.doc&&C.doc.f1),C.doc?`${C.doc.version} · 留出集 ${C.doc.items} 段`:'')}${card('账号与权限 F1',f3(C.account&&C.account.f1),C.account?`${C.account.version} · 留出集 ${C.account.items} 段`:'')}${card('干净需求被错报率',C.clean?pct(C.clean.rate):'—',C.clean?`${C.clean.fp} / ${C.clean.total}（单句 ${C.sentence&&C.sentence.version}）`:'')}</div>
  <div class="card p-5 mb-4"><div class="flex items-center justify-between gap-3 flex-wrap mb-3"><div class="text-sm font-semibold text-slate-800">13 条规则的 F1（留出集，第 1 次运行）</div>
    <div class="flex gap-4 text-xs text-slate-500">${RULE_GROUPS.map(g=>`<span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm" style="background:${g.color}"></span>${g.name}</span>`).join('')}</div></div>
    ${rules.map((r,i)=>{const g=RULE_GROUPS.find(g=>g.ids.includes(r.id))||RULE_GROUPS[0];const first=i>0&&!g.ids.includes(rules[i-1].id);
      return `<div class="flex items-center gap-3 text-xs mb-1.5 ${first?'pt-2.5 mt-2.5 border-t border-slate-100':''}"><span class="w-40 shrink-0 text-slate-600 truncate">${r.id} ${esc(RULES[r.id]||'')}</span><div class="flex-1 h-2 bg-slate-100 rounded-full"><div class="h-2 rounded-full" style="width:${(r.f1||0)*100}%;background:${g.color}"></div></div><span class="w-12 text-right text-slate-700">${f3(r.f1)}</span></div>`}).join('')||'<div class="text-sm text-slate-400">没有评测数据</div>'}</div>
  <div class="grid xl:grid-cols-2 gap-4 mb-4">
    <div class="card p-5 overflow-auto"><div class="text-sm font-semibold text-slate-800 mb-3">版本历史</div><table class="w-full text-xs"><thead><tr class="text-slate-500 text-left"><th class="py-1.5">规则组</th><th>版本</th><th>合计 F1</th><th>干净条目被错报</th><th>三次一致</th><th>是否采用</th></tr></thead><tbody>
      ${(d.versions||[]).map(v=>`<tr class="border-t border-slate-100"><td class="py-1.5">${esc(v.group)}</td><td>${esc(v.version)}</td><td>${f3(v.f1)}</td><td>${v.clean_fp} / ${v.clean_total}</td><td>${pct(v.consistency)}</td><td>${v.adopted?'<span class="tag-success">采用</span>':'<span class="tag-gray">未采用</span>'}</td></tr>`).join('')}</tbody></table></div>
    <div class="card p-5 overflow-auto"><div class="text-sm font-semibold text-slate-800 mb-3">单次运行与多数表决（3 次里至少 2 次报出才算）</div><table class="w-full text-xs"><thead><tr class="text-slate-500 text-left"><th class="py-1.5">集合</th><th>单次 F1</th><th>多数表决 F1</th><th>单次三次一致</th><th>多数表决一致率</th></tr></thead><tbody>
      ${(d.majority||[]).map(v=>`<tr class="border-t border-slate-100"><td class="py-1.5">${esc(v.set)} · ${esc(v.version)}</td><td>${f3(v.single_f1)}</td><td>${f3(v.majority_f1)}</td><td>${pct(v.single_consistency)}</td><td>${v.majority_consistency==null?'需要再跑 3 次':pct(v.majority_consistency)}</td></tr>`).join('')}</tbody></table></div>
  </div>
  <div class="grid xl:grid-cols-2 gap-4">
    <div class="card p-5 overflow-auto"><div class="text-sm font-semibold text-slate-800 mb-3">多人标注一致率</div>${(d.agreement||[]).length?`<table class="w-full text-xs"><thead><tr class="text-slate-500 text-left"><th class="py-1.5">规则组</th><th>规则</th><th>一致率</th><th>Cohen's kappa</th></tr></thead><tbody>${d.agreement.map(a=>`<tr class="border-t border-slate-100"><td class="py-1.5">${esc(a.group)}</td><td>${esc(a.rule)}</td><td>${pct(a.agreement)}</td><td>${f3(a.kappa)}</td></tr>`).join('')}</tbody></table>`:'<div class="text-sm text-slate-400">还没有多人标注结果（results/agreement/）</div>'}</div>
    <div class="card p-5 overflow-auto"><div class="text-sm font-semibold text-slate-800 mb-3">线上指标（近 30 天，只记次数）</div>${onlineTable(m)}</div>
  </div>`}
function onlineTable(m){if(!m||!m.rows)return '<div class="text-sm text-slate-400">暂无数据</div>';const pct=x=>x==null?'—':(x*100).toFixed(1)+'%';
  return `<table class="w-full text-xs"><tbody>${m.rows.map(r=>`<tr class="border-t border-slate-100"><td class="py-1.5 text-slate-600">${esc(r.name)}</td><td class="text-right text-slate-800">${r.pct?pct(r.value):esc(r.value??'—')}</td><td class="text-right text-slate-400 pl-3">${esc(r.detail||'')}</td></tr>`).join('')}</tbody></table>`}

/* ---------- 接入 GitHub（F29） ---------- */
function renderGithub(){const v=k=>($('#gh-'+k)||{}).value||'';
  const form=[['repo','仓库','owner/name'],['path','PRD 文件路径','docs/PRD.md'],['base','模型接口地址','https://api.deepseek.com'],['secret','密钥名称','LLM_API_KEY']];
  if(!$('#gh-repo'))$('#tab-github').innerHTML=`<div class="max-w-[960px] mx-auto card p-6"><div class="text-base font-semibold mb-1">接入 GitHub</div><p class="text-sm text-slate-500 mb-4">合并请求修改了 PRD 文件时，自动审查改动涉及的需求和所在段落，结果作为一条评论发在合并请求下；再次推送时更新这条评论。模型密钥用仓库自己配置的密钥，不经过本站，也不占在线版额度。</p>
    <div class="grid md:grid-cols-2 gap-4">${form.map(([k,t,p])=>`<label class="text-sm text-slate-600">${t}<input id="gh-${k}" class="w-full mt-1 border border-slate-200 rounded px-3 py-2" placeholder="${p}" value="${k==='base'?p:k==='secret'?p:''}"></label>`).join('')}</div>
    <div class="flex justify-between items-center mt-5 mb-2"><div class="text-sm font-semibold">.github/workflows/prd-review.yml</div><button class="btn-outline" id="gh-copy">复制配置</button></div><pre id="gh-yml" class="text-xs bg-slate-900 text-slate-100 rounded p-4 overflow-auto"></pre></div>`;
  const yml=()=>`name: AI 审 PRD
on:
  pull_request:
    paths: ['${v('path')||'docs/PRD.md'}']
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: curl -fsSL ${location.origin}/github/review-pr.mjs -o review-pr.mjs && curl -fsSL ${location.origin}/split.js -o split.js && curl -fsSL ${location.origin}/github/prompts.json -o prompts.json
      - run: node review-pr.mjs
        env:
          PRD_PATHS: ${v('path')||'docs/PRD.md'}
          LLM_BASE_URL: ${v('base')||'https://api.deepseek.com'}
          LLM_MODEL: deepseek-chat
          LLM_API_KEY: \${{ secrets.${v('secret')||'LLM_API_KEY'} }}
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: \${{ github.event.pull_request.base.sha }}
          HEAD_SHA: \${{ github.event.pull_request.head.sha }}
          PR_NUMBER: \${{ github.event.pull_request.number }}
          REPO: \${{ github.repository }}`;
  const upd=()=>{$('#gh-yml').textContent=yml()};upd();form.forEach(([k])=>$('#gh-'+k).oninput=upd);
  $('#gh-copy').onclick=()=>navigator.clipboard.writeText(yml()).then(()=>toast('已复制配置'))}

// 飞书授权回来后继续导入：带着授权码换取凭证，再导出这份文档
(async()=>{const p=new URLSearchParams(location.search);if(!p.get('feishu')||!p.get('code'))return;history.replaceState(null,'',location.pathname);
  const u=p.get('state')||'';document.querySelector('#import-tabs [data-src=link]').click();$('#url').value=u;
  linkMsg('<div class="text-sm text-slate-500"><span class="spin"></span> 正在从飞书导出文档…</div>');
  try{const st=await post('/api/feishu/start',{url:u,code:p.get('code')});const task=await post('/api/feishu/export',{url:u,token:st.token});let r;
    for(let i=0;i<30;i++){r=await post('/api/feishu/result',{url:u,ticket:task.ticket,token:st.token});if(r.done)break;await new Promise(z=>setTimeout(z,2000))}
    if(!r||!r.done)throw new Error('等待飞书导出超时');const bin=Uint8Array.from(atob(r.base64),c=>c.charCodeAt(0)).buffer;const x=await fileToMd(bin,'docx');
    Object.assign(DOC,{name:u,source:'feishu',docx:bin,notices:x.notices});$('#prd').value=x.md;linkMsg('');importSummary('已从飞书导入');event('import_ok','feishu')}
  catch(e){linkMsg(errBox('飞书返回：'+esc(e.message)+'。可以改用手动导出：在飞书打开文档，点右上方「…」>「下载为」> Word，再上传。'));event('import_fail','feishu')}})();
goStep('import');renderImportSide();
</script>
